# Releases Tilr from CI by hand from a release/X.Y branch. The branch job refuses
# other refs before keys are used. The app job verifies the pinned signed upstream
# tilrd release, then compiles, signs and notarizes both app architectures.
# The publish job publishes the tested server and app artifacts after approval.
# No caches: dependency build scripts run on clean runners. Release runs are serialized.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (CFBundleShortVersionString), e.g. 0.3.0
        required: true
      build:
        description: App build (CFBundleVersion); empty selects highest published build + 1
        required: false
      channel:
        description: Update channel
        type: choice
        options: [stable, beta]
        default: stable
      server_min_app_build:
        description: Oldest app build the pinned server supports
        default: '1'
      notes:
        description: Release notes for Sparkle and GitHub (plain text, optional)
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Public half of the release key: Sparkle and the server feed (release.local.json locally).
  TILR_UPDATE_PUBLIC_KEY: pbumHO+mL+o+BzD0cBPPXxHyxkOJzyGtvUSfwr0IvMg=
  TILR_NOTARY_PROFILE: tilr-ci

jobs:
  branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse a ref other than a release branch
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/release/?*) echo "Releasing from ${REF#refs/heads/}" ;;
            *) echo "::error::Release runs only from a release/X.Y branch, not $REF"; exit 1 ;;
          esac


  app:
    needs: branch
    outputs:
      build: ${{ steps.number.outputs.build }}
    runs-on: macos-26
    timeout-minutes: 120
    environment: apple-signing
    env:
      GITPM_DIR: ${{ github.workspace }}/.gitpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the gitpm pin
        id: gitpm
        run: echo "sha=$(grep -v '^#' gitpm.pin | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tilr-dev/gitpm
          ref: ${{ steps.gitpm.outputs.sha }}
          path: .gitpm
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Resolve the app build
        id: number
        env:
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/ci_release.py build --channel "$CHANNEL" --build "$BUILD"

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          xcodebuild -version
          swift --version

      # Before any key is on the runner: the plugin manager, Swift packages and both app
      # architectures with release.py's own swift invocation, so signing finds them up to date.
      - name: Compile
        run: |
          scripts/build-gitpm.sh --arch arm64 --arch x86_64
          swift package resolve
          export CLANG_MODULE_CACHE_PATH="$PWD/.build/ModuleCache"
          export SWIFTPM_MODULECACHE_OVERRIDE="$CLANG_MODULE_CACHE_PATH"
          for arch in arm64 x86_64; do
            swift build --package-path "$PWD" --scratch-path "$PWD/.build/release-$arch" -c release \
              --build-system native --arch "$arch"
          done

      - name: Fetch the signed upstream server
        env:
          MIN_APP_BUILD: ${{ inputs.server_min_app_build }}
        run: python3 scripts/fetch_server.py --public-key "$TILR_UPDATE_PUBLIC_KEY" --min-app-build "$MIN_APP_BUILD"

      - name: Pack the server
        run: tar -cf server.tar -C build server-releases

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: server.tar
          if-no-files-found: error

      - name: Import the Developer ID and notarization key
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/ci-apple-keychain.sh import

      - name: Sign, notarize and package both architectures
        env:
          TILR_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ steps.number.outputs.build }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release_all.py --version "$VERSION" --build "$BUILD" --channel "$CHANNEL"

      - name: Remove the keychain
        if: always()
        run: scripts/ci-apple-keychain.sh cleanup

      # The publish job needs the completed releases and the Sparkle tools resolved here.
      - name: Pack the app
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ steps.number.outputs.build }}
        run: |
          tar -cf app.tar "build/releases/$VERSION-$BUILD-arm64" "build/releases/$VERSION-$BUILD-x86_64" \
            .build/artifacts/sparkle/Sparkle/bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: app.tar
          if-no-files-found: error

  publish:
    needs: app
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    # Required reviewer: nothing is published before Dan approves the tested artifacts.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The AWS CLI comes from the runner image; its version goes into the release log.
      - name: Check AWS CLI
        run: aws --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app

      - name: Unpack the releases
        run: |
          mkdir -p build
          tar -xf server.tar -C build
          tar -xf app.tar
          rm server.tar app.tar

      # A key file instead of a Keychain item: no access prompt on an unattended runner.
      - name: Write the Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?set the SPARKLE_PRIVATE_KEY secret of the release environment}"
          umask 077
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "TILR_SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      # Publish the imported server bytes to the independent application update feed.
      - name: Publish the server
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          read -r version build < <(python3 -c 'import json; p = json.load(open("server-release.json")); print(p["version"], p["build"])')
          python3 scripts/release_server.py --version "$version" --build "$build" --publish-only

      - name: Publish the app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ needs.app.outputs.build }}
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
        run: |
          notes=()
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
            notes=(--notes "$RUNNER_TEMP/notes.txt")
          fi
          python3 scripts/release_all.py --version "$VERSION" --build "$BUILD" --channel "$CHANNEL" \
            --publish-only "${notes[@]}"
          cat "build/releases/$VERSION-$BUILD-$CHANNEL-downloads.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ needs.app.outputs.build }}
          NOTES: ${{ inputs.notes }}
        run: python3 scripts/ci_release.py github --version "$VERSION" --build "$BUILD"

      - name: Remove the Sparkle key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle.key"
