# Pushes to release/X.Y create candidates through the shared release workflow.
# Signing and publication use the same completed artifacts, without environment review.
# Pushing a stable vX.Y.Z tag approves building and publishing that tag.
# No caches; release runs are serialized across branches for appcast build allocation.
name: Release

on:
  push:
    branches: ['release/**']
    tags: ['v*', '!v*-rc.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Public half of the release key: application Sparkle updates.
  TILR_UPDATE_PUBLIC_KEY: pbumHO+mL+o+BzD0cBPPXxHyxkOJzyGtvUSfwr0IvMg=
  TILR_NOTARY_PROFILE: tilr-ci

jobs:
  release:
    permissions:
      contents: read
    uses: tilr-dev/.github/.github/workflows/release-branch.yml@c31b80fcfd5cb9398a193d422c212326302d0c44
    with:
      workflow-sha: c31b80fcfd5cb9398a193d422c212326302d0c44
      app-client-id: ${{ vars.TILR_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.TILR_BOT_PRIVATE_KEY }}

  app:
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.version != '' && (needs.release.outputs.is_rc == 'true' || (needs.release.outputs.is_rc == 'false' && github.ref_type == 'tag'))
    outputs:
      build: ${{ steps.number.outputs.build }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    runs-on: macos-26
    timeout-minutes: 120
    environment: apple-signing
    env:
      GITPM_DIR: ${{ github.workspace }}/.gitpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Read the gitpm pin
        id: gitpm
        run: echo "sha=$(grep -v '^#' gitpm.pin | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tilr-dev/gitpm
          ref: ${{ steps.gitpm.outputs.sha }}
          path: .gitpm
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify the release tag and read its numeric version
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/ci_release.py release --tag "$TAG" --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Resolve the app build
        id: number
        run: python3 scripts/ci_release.py build

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          xcodebuild -version
          swift --version

      # Before any key is on the runner: the plugin manager, Swift packages and both app
      # architectures with release.py's own swift invocation, so signing finds them up to date.
      - name: Compile
        run: |
          scripts/build-gitpm.sh --arch arm64 --arch x86_64
          swift package resolve
          export CLANG_MODULE_CACHE_PATH="$PWD/.build/ModuleCache"
          export SWIFTPM_MODULECACHE_OVERRIDE="$CLANG_MODULE_CACHE_PATH"
          for arch in arm64 x86_64; do
            swift build --package-path "$PWD" --scratch-path "$PWD/.build/release-$arch" -c release \
              --build-system native --arch "$arch"
          done

      - name: Fetch the signed upstream server
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_server.py

      - name: Import the Developer ID and notarization key
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/ci-apple-keychain.sh import

      - name: Sign, notarize and package both architectures
        env:
          TILR_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          VERSION: ${{ steps.metadata.outputs.version }}
          CHANNEL: ${{ steps.metadata.outputs.channel }}
          BUILD: ${{ steps.number.outputs.build }}
        run: python3 scripts/release_all.py --version "$VERSION" --build "$BUILD" --channel "$CHANNEL"

      - name: Remove the keychain
        if: always()
        run: scripts/ci-apple-keychain.sh cleanup

      # The publish job needs the completed releases and the Sparkle tools resolved here.
      - name: Pack the app
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          CHANNEL: ${{ steps.metadata.outputs.channel }}
          BUILD: ${{ steps.number.outputs.build }}
        run: |
          tar -cf app.tar "build/releases/$VERSION-$BUILD-arm64" "build/releases/$VERSION-$BUILD-x86_64" \
            .build/artifacts/sparkle/Sparkle/bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: app.tar
          if-no-files-found: error

  publish:
    needs: [release, app]
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    # Release branches and version tags only; the stable tag push is the approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # The AWS CLI comes from the runner image; its version goes into the release log.
      - name: Check AWS CLI
        run: aws --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app

      - name: Unpack the releases
        run: |
          mkdir -p build
          tar -xf app.tar
          rm app.tar

      - name: Verify the release tag before CDN publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: python3 scripts/ci_release.py release --tag "$TAG" --notes-file "$RUNNER_TEMP/notes.txt"

      # A key file instead of a Keychain item: no access prompt on an unattended runner.
      - name: Write the Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?set the SPARKLE_PRIVATE_KEY secret of the release environment}"
          umask 077
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "TILR_SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Publish the app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VERSION: ${{ needs.app.outputs.version }}
          CHANNEL: ${{ needs.app.outputs.channel }}
          BUILD: ${{ needs.app.outputs.build }}
        run: |
          python3 scripts/ci_release.py publish --tag "$TAG" --build "$BUILD" --notes-file "$RUNNER_TEMP/notes.txt"
          cat "build/releases/$VERSION-$BUILD-$CHANNEL-downloads.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the manifest DMGs to the shared GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          BUILD: ${{ needs.app.outputs.build }}
        run: python3 scripts/ci_release.py github --tag "$TAG" --build "$BUILD"

      - name: Remove the Sparkle key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle.key"
