# Builds both architectures, runs the script, SDK and native plugin tests and the app's
# --probe self-check in a test instance. No secrets: safe for pull requests from forks.
name: CI

on:
  merge_group:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash  # -eo pipefail: a failing probe fails the step through tee

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      GITPM_DIR: ${{ github.workspace }}/.gitpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the gitpm pin
        id: gitpm
        run: echo "sha=$(grep -v '^#' gitpm.pin | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tilr-dev/gitpm
          ref: ${{ steps.gitpm.outputs.sha }}
          path: .gitpm
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Public key matches the release workflow; no signing credentials are needed.
      - name: Verify the pinned upstream server
        env:
          TILR_UPDATE_PUBLIC_KEY: pbumHO+mL+o+BzD0cBPPXxHyxkOJzyGtvUSfwr0IvMg=
        run: python3 scripts/fetch_server.py --public-key "$TILR_UPDATE_PUBLIC_KEY"

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          xcodebuild -version
          swift --version

      # The plugin manager rebuilds only when its sources or build-gitpm.sh change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Vendor
            Sources/Gitpm/Generated
          key: gitpm-${{ steps.gitpm.outputs.sha }}-${{ hashFiles('scripts/build-gitpm.sh') }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Package.resolved', 'native-plugins/**/Package.resolved') }}

      - name: Plugin manager (gitpm)
        run: scripts/build-gitpm.sh --arch arm64 --arch x86_64

      - name: Build Intel (x86_64)
        run: swift build -c release --arch x86_64 --scratch-path .build/ci-x86_64

      - name: Server protocol integration tests
        run: |
          swiftc Sources/Tilr/ServerInstallation.swift scripts/test_server_installation.swift -o "$RUNNER_TEMP/test-server-installation"
          "$RUNNER_TEMP/test-server-installation"

      - name: App update preference integration tests
        run: python3 scripts/test_app_updates.py

      - name: Release script tests
        working-directory: scripts
        run: |
          swift package resolve --package-path ..
          for t in test_ci_release test_deltas test_fetch_server test_local_server test_packaging test_plugin_inventory test_publish test_release_all test_release_workflow test_server_release test_signing test_sparkle_key; do
            python3 -m unittest -v "$t"
          done
          python3 test_footprint.py
          python3 test_performance_adapter.py
          python3 test_performance_sampler.py

      - name: Native plugin SDK tests
        working-directory: native-plugins
        run: |
          swift test --disable-sandbox
          swift test --disable-sandbox --package-path SDK

      - name: Native plugin packages
        run: python3 scripts/test_native_plugins.py

      # Builds Tilr.app (arm64, release) and runs the self-check in a test instance.
      - name: Probe
        run: perl -e 'alarm 600; exec @ARGV' ./run.sh --test --probe 2>&1 | tee probe.log

      # ReportCrash writes the .ips a while after the crash: wait for it, print the faulting thread.
      - name: Crash report
        if: failure()
        run: |
          shopt -s nullglob
          reports=()
          for _ in $(seq 18); do
            reports=(~/Library/Logs/DiagnosticReports/Tilr*.ips /Library/Logs/DiagnosticReports/Tilr*.ips)
            [ ${#reports[@]} -gt 0 ] && break
            sleep 5
          done
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No Tilr crash report after 90 s; system log:"
            log show --predicate 'process == "Tilr" OR process == "ReportCrash" OR process == "kernel"' --last 15m --style compact | grep -iv 'WebContent\[' | tail -150
            exit 0
          fi
          for f in "${reports[@]}"; do
            echo "== $f"
            python3 - "$f" <<'EOF'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          report = json.loads(body)
          print("exception:", json.dumps(report.get("exception")))
          print("termination:", json.dumps(report.get("termination")))
          images = report.get("usedImages", [])
          for thread in report.get("threads", []):
              if not thread.get("triggered"):
                  continue
              print("faulting thread:", thread.get("name") or thread.get("queue") or thread.get("id"))
              for i, frame in enumerate(thread.get("frames", [])[:30]):
                  index = frame.get("imageIndex")
                  image = images[index].get("name", "?") if index is not None and index < len(images) else "?"
                  line = f"{i:2} {image} {frame.get('symbol', '?')} +{frame.get('imageOffset', '?')}"
                  if "sourceFile" in frame:
                      line += f" {frame['sourceFile']}:{frame.get('sourceLine', '?')}"
                  print(line)
          EOF
          done

      - name: Probe log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-log
          path: |
            probe.log
            ~/Library/Logs/DiagnosticReports/Tilr*.ips
            /Library/Logs/DiagnosticReports/Tilr*.ips
            ~/Library/Application Support/dev.tilr.mac.test/*.log
          if-no-files-found: ignore
