# Pull requests, merge queue groups, release branch pushes, manual and nightly runs on main. Parallel
# jobs; `mac` is their aggregate and the check the main ruleset requires. The Intel build runs on
# every event but pull requests. No push to main: the merge queue has checked the merged result.
# No secrets: safe for pull requests from forks.
name: CI

on:
  merge_group:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: ['release/**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash  # -eo pipefail: a failing probe fails the step through tee

jobs:
  # Builds Tilr.app (arm64, release) and runs the self-check in a test instance.
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mac-setup
        with:
          job: probe

      - name: Probe
        run: perl -e 'alarm 600; exec @ARGV' ./run.sh --test --probe 2>&1 | tee probe.log

      # ReportCrash writes the .ips a while after the crash: wait for it, print the faulting thread.
      - name: Crash report
        if: failure()
        run: |
          shopt -s nullglob
          reports=()
          for _ in $(seq 18); do
            reports=(~/Library/Logs/DiagnosticReports/Tilr*.ips /Library/Logs/DiagnosticReports/Tilr*.ips)
            [ ${#reports[@]} -gt 0 ] && break
            sleep 5
          done
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No Tilr crash report after 90 s; system log:"
            log show --predicate 'process == "Tilr" OR process == "ReportCrash" OR process == "kernel"' --last 15m --style compact | grep -iv 'WebContent\[' | tail -150
            exit 0
          fi
          for f in "${reports[@]}"; do
            echo "== $f"
            python3 - "$f" <<'EOF'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          report = json.loads(body)
          print("exception:", json.dumps(report.get("exception")))
          print("termination:", json.dumps(report.get("termination")))
          images = report.get("usedImages", [])
          for thread in report.get("threads", []):
              if not thread.get("triggered"):
                  continue
              print("faulting thread:", thread.get("name") or thread.get("queue") or thread.get("id"))
              for i, frame in enumerate(thread.get("frames", [])[:30]):
                  index = frame.get("imageIndex")
                  image = images[index].get("name", "?") if index is not None and index < len(images) else "?"
                  line = f"{i:2} {image} {frame.get('symbol', '?')} +{frame.get('imageOffset', '?')}"
                  if "sourceFile" in frame:
                      line += f" {frame['sourceFile']}:{frame.get('sourceLine', '?')}"
                  print(line)
          EOF
          done

      - name: Probe log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-log
          path: |
            probe.log
            ~/Library/Logs/DiagnosticReports/Tilr*.ips
            /Library/Logs/DiagnosticReports/Tilr*.ips
            ~/Library/Application Support/dev.tilr.mac.test/*.log
          if-no-files-found: ignore

  release-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mac-setup
        with:
          job: release-tests

      - name: Release script tests
        working-directory: scripts
        run: |
          swift package resolve --package-path ..
          for t in test_ci_release test_deltas test_fetch_gitpm test_fetch_server test_local_server test_packaging test_plugin_inventory test_publish test_release_all test_release_workflow test_server_release test_signing test_sparkle_key; do
            python3 -m unittest -v "$t"
          done
          python3 test_footprint.py
          python3 test_performance_adapter.py
          python3 test_performance_sampler.py

  native-plugins:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mac-setup
        with:
          job: native-plugins
          build-paths: |
            .build
            native-plugins/.build
            native-plugins/SDK/.build

      - name: Native plugin SDK tests
        working-directory: native-plugins
        run: |
          swift test --disable-sandbox
          swift test --disable-sandbox --package-path SDK

      # The packages test builds Tilr with --skip-update: resolve its dependencies first.
      - name: Native plugin packages
        run: |
          swift package resolve
          python3 scripts/test_native_plugins.py

  app-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mac-setup
        with:
          job: app-tests
          gitpm: 'false'

      - name: Server protocol integration tests
        run: |
          swiftc Sources/Tilr/ServerInstallation.swift scripts/test_server_installation.swift -o "$RUNNER_TEMP/test-server-installation"
          "$RUNNER_TEMP/test-server-installation"

      - name: App update preference integration tests
        run: python3 scripts/test_app_updates.py

  x86_64:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/mac-setup
        with:
          job: x86_64

      - name: Build Intel (x86_64)
        run: swift build -c release --arch x86_64 --scratch-path .build/ci-x86_64

  # Required by the main ruleset. Runs whatever the jobs end with: a job skipped because a need
  # failed would pass as success. Only the Intel build may be skipped, and only on pull requests.
  mac:
    if: always()
    needs: [probe, release-tests, native-plugins, app-tests, x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          optional = {"x86_64"} if os.environ["EVENT"] == "pull_request" else set()
          failed = []
          for job, need in json.loads(os.environ["NEEDS"]).items():
              result = need["result"]
              print(f"{job}: {result}")
              if result != "success" and not (result == "skipped" and job in optional):
                  failed.append(job)
          if failed:
              sys.exit(f"Not passed: {', '.join(failed)}")
          EOF
