<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Tilr</title>
<!-- Starter page, copied into the site folder (~/tilr-mac) when it has no index.html.
     Edit the copy there. Everything on screen is a plugin (plugins/, plugins.json); the look is
     the theme plugin's CSS. A change under plugins/ hot-swaps just that plugin (runtime.js);
     a change to any other file reloads the page. -->
<script type="importmap">
  { "imports": {
    "cordis": "./vendor/cordis.js",
    "@deepseek-ai/cosmokit": "./vendor/cosmokit.js",
    "tilr": "./tilr.js"
  } }
</script>
<style>
  /* Only what must hold before, or without, a theme. */
  body { margin: 0; background: #000; color: #9399b2; font: 13px ui-monospace, Menlo, monospace; }
</style>
<main id="grid"></main>
<script type="module" src="runtime.js"></script>
</html>
