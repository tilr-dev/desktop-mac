<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Tilr</title>
<!-- Starter page, copied into the site folder (~/tilr-mac) when it has no index.html.
     Edit the copy there. A change under plugins/ hot-swaps just that plugin through
     cordis (runtime.js); a change to any other file reloads the page. -->
<script type="importmap">
  { "imports": { "cordis": "./vendor/cordis.js", "@deepseek-ai/cosmokit": "./vendor/cosmokit.js" } }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --panel: #0a0a0f; --line: #1e1e2e; --green: #6dd08c; --red: #ff5d5d;
    --text: #e7eaee; --muted: #9399b2;
  }
  body {
    margin: 0; height: 100dvh; box-sizing: border-box; padding: 24px; overflow: auto;
    background: var(--bg); color: var(--text);
    font: 13px/1.6 "0xProto Nerd Font", ui-monospace, Menlo, monospace;
  }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); min-height: 120px; display: flex; flex-direction: column; }
  .tile > header {
    padding: 6px 12px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-weight: bold; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  }
  .tile > .body { padding: 12px; flex: 1; }
  .big { font-size: 40px; font-weight: bold; line-height: 1.1; color: #fff; }
  .muted { color: var(--muted); }
  .green { color: var(--green); }
  button {
    font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    padding: 2px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--green); color: var(--green); }
  button:disabled { opacity: .4; cursor: default; }
  /* the panel plugin's rows */
  .plugins { list-style: none; margin: 0; padding: 0; }
  .plugins li { display: grid; grid-template-columns: 10px 1fr auto auto auto; gap: 10px; align-items: center; padding: 4px 0; }
  .plugins .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .plugins .dot.active { background: var(--green); }
  .plugins .dot.failed { background: var(--red); }
  .plugins .dot.pending, .plugins .dot.loading { background: var(--muted); }
  .plugins .state { color: var(--muted); font-size: 11px; }
  .plugins .error { grid-column: 1 / -1; color: var(--red); font-size: 11px; white-space: pre-wrap; }
  .switch { appearance: none; width: 28px; height: 16px; margin: 0; border: 1px solid var(--line); background: var(--bg); position: relative; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--muted); transition: left .12s; }
  .switch:checked { border-color: var(--green); }
  .switch:checked::after { left: 14px; background: var(--green); }
  .switch:disabled { opacity: .4; cursor: default; }
</style>
<main id="grid"></main>
<script type="module" src="runtime.js"></script>
</html>
