<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Tilr</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #16181d; color: #d7dae0; font: 17px/1.4 system-ui, sans-serif; -webkit-user-select: none;
  }
  h1 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; }
  h1 span { color: #6cb6ff; }
  p { margin: 0; color: #8b93a1; }
  code { font: 15px ui-monospace, Menlo, monospace; color: #d7dae0; }
</style>
<h1>Hello, <span>Tilr</span></h1>
<p>Your workspace starts here.</p>
<details>
  <summary>Use your own interface</summary>
  <p>Put an <code>index.html</code> in <code id="site"></code>.</p>
  <p>To use another folder, set <code>site:</code> in <code id="config"></code>.</p>
  <p>Changes reload automatically. Node.js is only needed to build TypeScript projects.</p>
</details>
<script>
  const params = new URLSearchParams(location.search)
  document.getElementById('site').textContent = params.get('site') ?? '?'
  document.getElementById('config').textContent = params.get('config') ?? '~/Library/Application Support/dev.tilr.mac/config.yml'
</script>
</html>
